# Local image builds with nginx TLS termination. Preserve pgdata and avatars.
# Configure .env, DNS and ./ssl before starting this deployment.
services:
  postgres:
    image: postgres:16-alpine
    container_name: wishhub-postgres
    env_file:
    - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./backups:/backups
    restart: unless-stopped
    networks:
    - wishhub-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-wishlist} -d ${POSTGRES_DB:-wishlist}
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: WishHub.Api/Dockerfile
    container_name: wishhub-api
    env_file:
    - .env
    environment:
    - ASPNETCORE_ENVIRONMENT=Production
    - ASPNETCORE_URLS=http://+:5000
    - ConnectionStrings__Default=Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    - Jwt__Secret=${JWT_SECRET}
    - Jwt__Issuer=${JWT_ISSUER}
    - Jwt__Audience=${JWT_AUDIENCE}
    - Jwt__AccessTokenExpiryMinutes=${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-60}
    - Jwt__RefreshTokenExpiryDays=${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-30}
    - Frontend__Url=${PUBLIC_URL}
    - OAuth__Vk__ClientId=${VK_CLIENT_ID}
    - OAuth__Vk__ClientSecret=${VK_CLIENT_SECRET}
    - OAuth__Vk__RedirectUri=${PUBLIC_URL}/api/auth/vk/callback
    - OAuth__Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
    - OAuth__Telegram__BotUsername=${TELEGRAM_BOT_USERNAME}
    - Logging__LogLevel__Default=Information
    - Logging__LogLevel__Microsoft.AspNetCore=Warning
    - Metadata__EnableOzonWbray=${METADATA_ENABLE_OZON_WBRAY:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
    - avatars:/app/wwwroot/avatars
    - ./logs/api:/app/logs
    restart: unless-stopped
    networks:
    - wishhub-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_HUB_URL: /hubs
    container_name: wishhub-frontend
    env_file:
    - .env
    depends_on:
    - api
    restart: unless-stopped
    networks:
    - wishhub-network
  nginx:
    image: nginx:alpine
    container_name: wishhub-nginx
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    - ./ssl:/etc/nginx/ssl:ro
    depends_on:
    - api
    - frontend
    restart: unless-stopped
    networks:
    - wishhub-network
volumes:
  pgdata:
    driver: local
  avatars:
    driver: local
networks:
  wishhub-network:
    driver: bridge
    ipam:
      config:
      - subnet: 172.20.0.0/16
