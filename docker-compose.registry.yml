# Prebuilt images for EasyPanel. Traefik routes the frontend; no host ports are published.
# Required environment variables are listed in .env.example. Preserve pgdata, avatars and wishlist_images.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    image: ghcr.io/${IMAGE_OWNER:-rabb1tof}/wishhub-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      WishlistImages__StoragePath: /app/App_Data/wishlist-images
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__AccessTokenExpiryMinutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-60}
      Jwt__RefreshTokenExpiryDays: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-30}
      Frontend__Url: ${PUBLIC_URL}
      OAuth__Vk__ClientId: ${VK_CLIENT_ID}
      OAuth__Vk__ClientSecret: ${VK_CLIENT_SECRET}
      OAuth__Vk__RedirectUri: ${PUBLIC_URL}/api/auth/vk/callback
      OAuth__Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      OAuth__Telegram__BotUsername: ${TELEGRAM_BOT_USERNAME}
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Metadata__EnableOzonWbray: ${METADATA_ENABLE_OZON_WBRAY:-false}
    volumes:
    - avatars:/app/wwwroot/avatars
    - wishlist_images:/app/App_Data/wishlist-images
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:5000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  frontend:
    image: ghcr.io/${IMAGE_OWNER:-rabb1tof}/wishhub-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
    - '80'
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:80/
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  pgdata: null
  avatars: null
  wishlist_images: null
