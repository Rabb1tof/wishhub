name: Create GitHub Release

# Triggered when you push a SemVer tag (v0.1.0, v1.2.3, v2.0.0-rc.1, …).
# Combined with `.github/workflows/build-and-push.yml` (which is also triggered
# by `v*.*.*` tags), this gives a clean release flow:
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# After the push:
#   - build-and-push.yml builds & publishes ghcr.io/.../wishhub-{api,frontend}:v0.2.0
#   - release.yml      creates a GitHub Release with notes pulled from CHANGELOG.md

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    # Manual re-run: if you change release.yml itself (e.g. add new assets)
    # and want to apply it to an existing release, trigger this workflow
    # from the Actions tab and provide the tag name.
    inputs:
      tag:
        description: "Existing tag to (re)create the release for, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write   # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag (push event vs manual dispatch)
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_tag.outputs.tag }}
          # full history so the auto-generated commit list works correctly
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          # e.g. "v0.1.0" or "v1.2.3-rc.1"
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          # Detect prerelease (anything after a hyphen: -rc, -beta, -alpha…)
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Pull the section between "## [VERSION]" and the next "## [" header.
          # Falls back to a placeholder if no matching section is found.
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            flag && $0 ~ "^## \\["  { flag=0 }
            flag                   { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="_No CHANGELOG.md entry was found for this version. See the commit list below._"
          fi

          {
            echo "notes<<__EOF__"
            echo "$NOTES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Stage release assets
        # Bundle a "ready-to-deploy kit": rename the registry compose to a
        # plain docker-compose.yml so users can `wget` it and run
        # `docker compose up -d` without hunting through the repo.
        run: |
          mkdir -p artifacts
          cp docker-compose.registry.yml artifacts/docker-compose.yml
          cp .env.example                artifacts/.env.example

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ${{ steps.changelog.outputs.notes }}

            ---

            ## Quick start

            Download the two attached files (`docker-compose.yml` and `.env.example`) into an empty directory, then:

            ```bash
            cp .env.example .env
            # edit .env — set IMAGE_TAG=${{ steps.version.outputs.tag }} and your secrets
            docker compose up -d
            ```

            ## Container images

            All images are public on GHCR — no auth needed for `docker pull`:

            - `ghcr.io/${{ github.repository_owner }}/wishhub-api:${{ steps.version.outputs.tag }}`
            - `ghcr.io/${{ github.repository_owner }}/wishhub-api:${{ steps.version.outputs.version }}`
            - `ghcr.io/${{ github.repository_owner }}/wishhub-frontend:${{ steps.version.outputs.tag }}`
            - `ghcr.io/${{ github.repository_owner }}/wishhub-frontend:${{ steps.version.outputs.version }}`
          files: |
            artifacts/docker-compose.yml
            artifacts/.env.example
          generate_release_notes: true   # appends GitHub's auto-generated commit/PR list
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
