name: Build and Push Docker Images

# Builds both images (API + Frontend) and pushes them to GitHub Container
# Registry (ghcr.io). EasyPanel pulls these prebuilt images instead of
# building on the server, so the VPS doesn't waste disk on build cache.
#
# This workflow uses GitHub-hosted runners (ubuntu-latest), which are FREE
# and UNLIMITED for public repositories — no billing required.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (in addition to default ones)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/wishhub-api
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/wishhub-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        # Disposable CI credentials; never used by a deployment.
        env:
          POSTGRES_DB: wishhub_ci
          POSTGRES_USER: wishhub_ci
          POSTGRES_PASSWORD: local-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishhub_ci -d wishhub_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=wishhub_ci;Username=wishhub_ci;Password=local-ci-only-password
      WISHHUB_TEST_POSTGRES: Host=localhost;Port=5432;Database=wishhub_ci;Username=wishhub_ci;Password=local-ci-only-password
      Jwt__Secret: Disposable-CI-only-signing-key-not-used-by-any-deployment-1234567890
      Jwt__Issuer: WishHub
      Jwt__Audience: WishHubUsers
      Jwt__AccessTokenExpiryMinutes: 60
      Jwt__RefreshTokenExpiryDays: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests including PostgreSQL
        run: dotnet test WishHub.sln -c Release --logger trx --results-directory TestResults
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          npm run lint

  # =============================================
  # Backend API
  # =============================================
  build-api:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          # On a SemVer tag push (v0.1.0), this produces tags:
          #   v0.1.0, 0.1.0, 0.1, sha-abc1234
          # On a main-branch push, it produces:
          #   latest, main, sha-abc1234
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: WishHub.Api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: false

  # =============================================
  # Frontend
  # =============================================
  build-frontend:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=/api
            VITE_HUB_URL=/hubs
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: false
